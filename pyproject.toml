[project]
name = "consort"
version = "0.0.1"
description = "Fraud Known by the Company It Keeps: when scoring an account by its neighbourhood beats scoring it alone, measured on a real Bitcoin transaction graph and on synthetic bank transfers with labelled laundering patterns."
readme = "README.md"
requires-python = ">=3.13,<3.14"
authors = [{ name = "Peter Parker" }]
dependencies = [
  # Every manifest, outcome record and run summary is a pydantic model. 2.x is the current
  # line; 3 would be a rewrite of the validation API the schemas lean on.
  "pydantic>=2,<3",
  # Bootstrap intervals, paired deltas, the metric arithmetic. 2.x is the line with the
  # Generator API the fixed seeds use and the stable dtype promotion rules.
  "numpy>=2,<3",
  # Sparse adjacency for the k-hop features and PageRank, and connected components for the
  # bootstrap groups. Stable across 1.x; 2 is not out and would be allowed to move them.
  "scipy>=1.14,<2",
  # Feature tables and the CSV loaders. 2.x is the line with copy-on-write by default, which
  # the feature code assumes (no chained assignment); 3 changes string dtypes again.
  "pandas>=2.2,<3",
  # Outcome files and feature tables are parquet. pyarrow takes a major every few months and
  # has removed APIs in them, so the range is the one major installed and tested.
  "pyarrow>=26,<27",
  # The edge table, the self-join neighbourhood fetch and the serving benchmark's columnar
  # store. 1.x is the line with a stable on-disk format; the version is recorded in
  # docs/serving.md beside every latency number.
  "duckdb>=1.3,<2",
  # Arms R and G. 3.x is the line whose default tree method and categorical handling the
  # feature tables were written against; a major would change both.
  "xgboost>=3,<4",
  # Configuration files.
  "pyyaml>=6,<7",
  # Command line. 0.x is the only line typer has; pinned below 1.
  "typer>=0.15,<1",
  # The loaders call its command line to fetch Elliptic and the IBM set with the reader's own
  # token. 2.x is the line whose CLI the fetch step was written against (datasets download
  # with -f, -p and --unzip); it authenticates on import, so it is only ever run as a command.
  "kaggle>=2,<3",
  # Elliptic++ is published only as a public Google Drive folder. 5.x is the line with
  # download(id=...) and the folder listing the source ids were read with (5.2.2, 2026-11-01).
  "gdown>=5,<6",
]

[project.optional-dependencies]
# Arm N. Installed on the rented card and, CPU only, wherever the GNN tests run. PyTorch
# Geometric 2.x is the line with the NeighborLoader and the explain module this project uses;
# torch 2.x is what it builds against.
gnn = [
  "torch>=2.5,<3",
  "torch-geometric>=2.6,<3",
]
# The ONNX handover to 09. onnxmltools converts XGBoost boosters; onnxruntime runs the export
# test. Both 1.x.
export = [
  "onnx>=1.17,<2",
  "onnxmltools>=1.13,<2",
  "onnxruntime>=1.20,<2",
]

# The TabFM column. 1.0.1 (2026-07-09) is the latest release on PyPI and the one whose loader
# names the google/tabfm-1.0.0-pytorch weights; a 1.1.0 weight set exists with no matching code
# release. Exact pin: a zero-shot model's version is part of the result. Weights are under the
# TabFM Non-Commercial License v1.0 and are fetched at run time, never committed.
tabfm = [
  "tabfm[pytorch]==1.0.1",
]
# The graph-database store in the serving benchmark. The 6.x driver speaks to Neo4j 5 and
# later servers; 5.x is allowed because the Cypher used is the same.
neo4j = [
  "neo4j>=5,<7",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "mypy>=1,<2",
  "ruff>=0.13,<1",
  "pandas-stubs>=2.2,<3",
  "scipy-stubs>=1.14",
  "types-PyYAML>=6,<7",
]

[project.scripts]
consort = "consort.cli:main"

[build-system]
requires = ["hatchling>=1,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["consort"]

[tool.ruff]
line-length = 100
target-version = "py313"
# ruff formats Python blocks inside Markdown by default; the plan and docs keep their layout.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "RUF"]
ignore = [
  # Line length is handled by the formatter.
  "E501",
  # LabelLeak and MismatchedItems read as the conditions they describe; an Error suffix adds
  # nothing a reader of the traceback needs.
  "N818",
]

[tool.ruff.lint.per-file-ignores]
# Typer declares a command's options as its argument defaults. That is the library's
# interface rather than the mistake B008 usually catches.
"consort/cli.py" = ["B008"]
# X, A and similar are the conventional names for a design matrix and an adjacency matrix.
"consort/**/*.py" = ["N803", "N806"]
"tests/*.py" = ["N803", "N806"]

[tool.mypy]
python_version = "3.13"
files = ["consort", "tests"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

# These ship annotations that are incomplete rather than absent; their modules are held as
# Any, which keeps strict mode on this project's own code.
[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*", "xgboost", "xgboost.*", "duckdb", "duckdb.*", "gdown", "gdown.*"]
ignore_missing_imports = true
follow_imports = "skip"

# The GNN and export stacks are optional extras, absent where CI runs mypy.
[[tool.mypy.overrides]]
module = [
  "torch", "torch.*", "torch_geometric", "torch_geometric.*", "onnx", "onnx.*",
  "onnxmltools", "onnxmltools.*", "onnxruntime", "onnxruntime.*", "tabfm", "tabfm.*",
  "neo4j", "neo4j.*",
]
ignore_missing_imports = true
follow_imports = "skip"

# Arm N subclasses torch's Module, which is Any where torch is not installed (CI). Strict mode
# stays on for everything else in the module.
[[tool.mypy.overrides]]
module = ["consort.models.gnn"]
disallow_subclassing_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
