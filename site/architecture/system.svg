<svg xmlns="http://www.w3.org/2000/svg" width="1236" height="1148" viewBox="0 0 1236 1148" role="img" aria-label="Public transaction graphs are fetched with their licences quoted and built once into DuckDB edge tables and PyTorch Geometric objects; temporal inductive splits pass a leakage test on every build; three arms and a foundation-model column score the same accounts; one evaluator that does not know which model scored writes the intervals; the explanations, the serving benchmark, the gate and the report follow, and the ONNX scorer and feature view are handed to project 09." font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
