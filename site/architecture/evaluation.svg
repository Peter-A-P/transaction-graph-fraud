<rect x="28.0" y="90.0" width="300.0" height="64.0" rx="4" fill="#FFFFFF" stroke="#14201E" stroke-width="1.1"/>
<text x="178.0" y="118.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">Temporal inductive split</text>
<text x="178.0" y="134.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">train early, validate next, test latest</text>
<rect x="28.0" y="202.0" width="300.0" height="64.0" rx="4" fill="#FFFFFF" stroke="#14201E" stroke-width="1.1"/>
<text x="178.0" y="230.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">Random split, run once</text>
<text x="178.0" y="246.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">the leakage gap</text>
<rect x="28.0" y="314.0" width="300.0" height="64.0" rx="4" fill="#FFFFFF" stroke="#14201E" stroke-width="1.1"/>
<text x="178.0" y="342.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">Unknown-label nodes</text>
<text x="178.0" y="358.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">pass messages, never counted</text>
