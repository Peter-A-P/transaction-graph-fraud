<text x="618.0" y="119.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">no test-step row in training; no feature</text>
<text x="618.0" y="135.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">reads a label</text>
<text x="618.0" y="152.0" font-size="11" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" text-anchor="middle" fill="#5C6B67">consort.data.leakage</text>
<rect x="468.0" y="202.0" width="300.0" height="64.0" rx="4" fill="#FFFFFF" stroke="#0E6E60" stroke-width="1.6"/>
<rect x="468.0" y="202.0" width="5" height="64.0" rx="2" fill="#0E6E60"/>
