<text x="618.0" y="574.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">time steps or components; 95% intervals;</text>
<text x="618.0" y="590.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">paired deltas on identical items</text>
<rect x="28.0" y="649.0" width="300.0" height="66.0" rx="4" fill="#FFFFFF" stroke="#A64C1C" stroke-width="1.6"/>
