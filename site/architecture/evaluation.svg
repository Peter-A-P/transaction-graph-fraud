<text x="1058.0" y="358.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">0 to 3 hops, gain beside fetch latency</text>
<rect x="908.0" y="426.0" width="300.0" height="64.0" rx="4" fill="#FFFFFF" stroke="#A64C1C" stroke-width="1.6"/>
<rect x="908.0" y="426.0" width="5" height="64.0" rx="2" fill="#A64C1C"/>
