<text x="178.0" y="462.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">train 1 to 34; test 39 to 42 and 43 to 49;</text>
<text x="178.0" y="478.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">context swap step by step</text>
<rect x="908.0" y="202.0" width="300.0" height="64.0" rx="4" fill="#FFFFFF" stroke="#14201E" stroke-width="1.1"/>
