<text x="618.0" y="239.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">fetch-path features equal batch features</text>
<text x="618.0" y="256.0" font-size="11" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" text-anchor="middle" fill="#5C6B67">consort.serve.parity</text>
