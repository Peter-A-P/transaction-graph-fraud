<svg xmlns="http://www.w3.org/2000/svg" width="1236" height="772" viewBox="0 0 1236 772" role="img" aria-label="Elliptic&#x27;s 49 time steps give the temporal inductive split, the random split run once for the leakage gap, the unknown-label rule and the shift split at step 43 with the context-swap schedule; the synthetic set gives the serving benchmark, the hop curve and recall by generator pattern; the leakage test guards every split and the parity test guards the serving path; every claim is bootstrapped over groups before the faithfulness number, the gate and the cost table are written." font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
