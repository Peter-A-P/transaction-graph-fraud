<text x="618.0" y="310.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">GraphSAGE or GAT, sampled neighbours,</text>
<text x="618.0" y="326.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">inductive; directed-multigraph flags</text>
