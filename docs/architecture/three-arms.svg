<svg xmlns="http://www.w3.org/2000/svg" width="1236" height="500" viewBox="0 0 1236 500" role="img" aria-label="One account with its row features and its k-hop neighbourhood, capped at a stated number of neighbours per hop, is scored three ways: gradient boosting on the row alone, gradient boosting on the row plus features computed from the neighbourhood with no feature allowed to read a label, and a graph neural network with neighbour sampling; the tabular foundation model scores the first two feature tables from a stratified context that keeps every positive; one evaluator reads every score the same way." font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
