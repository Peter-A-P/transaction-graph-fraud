<text x="1058.0" y="199.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">AUPRC, recall at 1% FPR, recall at 0.5%</text>
<text x="1058.0" y="215.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">and 1% alert budget; by pattern; by hop</text>
