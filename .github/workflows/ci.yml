name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      # The export extra (onnx, onnxruntime) is small, so the ONNX round-trip test runs here.
      # The gnn extra is not installed: torch from PyPI on Linux is the multi-gigabyte CUDA
      # build. Arm N's tests run where it is installed; its sampler's tests need no torch and
      # run here.
      - run: uv sync --frozen --extra export
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      # No network in this job, by design. Every test runs against toy graphs and format
      # fixtures; nothing here fetches a dataset. The leakage test is in this run, so it runs
      # on every build.
      - run: uv run pytest
